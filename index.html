<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal life dashboard — focus timer, tasks, quick links." />
  <title>Life Dashboard App</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧭</text></svg>" />
</head>
<body>

  <!-- ── App Wrapper ──────────────────────────────────────── -->
  <div class="app-wrapper">

    <!-- Top Bar -->
    <header class="top-bar">
      <button class="name-edit-btn" id="name-edit-btn">✦ Set name</button>
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme">☀️</button>
    </header>

    <!-- Greeting -->
    <section class="greeting-section" aria-label="Greeting">
      <div class="greeting-time" id="time-display" aria-live="polite">00:00</div>
      <div class="greeting-date"  id="date-display">—</div>
      <div class="greeting-message" id="greeting-text" aria-live="polite">Good morning.</div>
    </section>

    <!-- Dashboard Grid -->
    <main class="dashboard-grid">

      <!-- ── To-Do List ───────────────────────────────────── -->
      <section class="card card-todo" aria-label="To-Do List">
        <div class="card-header">
          <h2 class="card-title">
            <span class="card-title-accent"></span>Tasks
          </h2>
          <div class="todo-stats">
            <span id="task-count">0 tasks</span>
            <span class="todo-stat-pill" id="task-done-pill" style="display:none">
              <span id="task-done-count"></span>
            </span>
          </div>
        </div>

        <!-- Add task -->
        <div class="todo-input-row">
          <input
            type="text"
            class="input-field"
            id="todo-input"
            placeholder="Add a task…"
            maxlength="200"
            autocomplete="off"
            aria-label="New task"
          />
          <button class="btn btn-primary" id="todo-add-btn" aria-label="Add task">Add</button>
        </div>
        <p class="duplicate-toast" id="duplicate-toast" role="alert">
          ⚠ This task already exists.
        </p>

        <!-- Task list -->
        <ul class="todo-list" id="todo-list" role="list" aria-label="Task list">
          <li class="todo-empty">No tasks yet. Add one above ✦</li>
        </ul>
      </section>

      <!-- ── Focus Timer ──────────────────────────────────── -->
      <section class="card card-timer" aria-label="Focus Timer">
        <div class="card-header">
          <h2 class="card-title">
            <span class="card-title-accent"></span>Focus Timer
          </h2>
        </div>

        <div class="timer-display">
          <!-- SVG ring -->
          <div class="timer-ring-wrapper" role="img" aria-label="Timer progress">
            <svg class="timer-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <!-- r = 54, center = 60,60, circumference = 2π×54 ≈ 339.29 -->
              <circle class="timer-ring-bg"       cx="60" cy="60" r="54" />
              <circle class="timer-ring-progress"
                      id="timer-ring-progress"
                      cx="60" cy="60" r="54"
                      stroke-dasharray="339.29"
                      stroke-dashoffset="0" />
            </svg>
            <div class="timer-digits" id="timer-digits" aria-live="polite">25:00</div>
          </div>

          <p class="timer-label" id="timer-status">25-minute focus session</p>

          <div class="timer-controls">
            <button class="btn btn-primary"  id="timer-start">Start</button>
            <button class="btn btn-ghost"    id="timer-stop">End</button>
            <button class="btn btn-ghost"    id="timer-reset" disabled>Reset</button>
          </div>
        </div>
      </section>

      <!-- ── Quick Links ──────────────────────────────────── -->
      <section class="card card-links" aria-label="Quick Links">
        <div class="card-header">
          <h2 class="card-title">
            <span class="card-title-accent"></span>Quick Links
          </h2>
        </div>

        <!-- Add link -->
        <div class="links-add-row">
          <input
            type="text"
            class="input-field"
            id="link-label-input"
            placeholder="Label (optional)"
            maxlength="40"
            autocomplete="off"
            aria-label="Link label"
          />
          <input
            type="url"
            class="input-field"
            id="link-url-input"
            placeholder="https://…"
            maxlength="500"
            autocomplete="off"
            aria-label="Link URL"
          />
          <button class="btn btn-primary" id="link-add-btn" aria-label="Add link">Add</button>
        </div>

        <!-- Links grid -->
        <div class="links-grid" id="links-grid">
          <span class="links-empty">No links saved yet.</span>
        </div>
      </section>

    </main>
  </div><!-- /.app-wrapper -->

  <!-- ── Name Modal ───────────────────────────────────────── -->
  <div class="modal-overlay" id="name-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h2 id="modal-title">What's your name?</h2>
      <p>It'll appear in your daily greeting.</p>
      <input
        type="text"
        class="input-field"
        id="name-input-modal"
        placeholder="e.g. Alex"
        maxlength="50"
        autocomplete="off"
        aria-label="Your name"
      />
      <div class="modal-actions">
        <button class="btn btn-ghost"   id="name-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="name-save-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
